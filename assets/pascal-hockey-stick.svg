.result{fill:#16826a;stroke:#0b5e4b;stroke-width:2}
.value{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f4038;text-anchor:middle}
.value.light{fill:#fff}
.equation{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#633d1f}
.legend{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#52635d}
</style>
