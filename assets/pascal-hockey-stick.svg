<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
<title id="title">Identidad del palo de hockey en Pascal</title>
<desc id="desc">La diagonal destacada 1, 3, 6 y 10 se suma para dar 20, situado en la fila siguiente.</desc>
<rect width="780" height="520" rx="24" fill="#f6f6f2"/>
<text x="40" y="49" class="heading">Identidad del palo de hockey</text>
<text x="40" y="78" class="subheading">Una diagonal suma el número de la fila siguiente</text>
<path d="M 458 238 L 424 283 L 390 328 L 356 373 L 390 418" fill="none" stroke="#16826a" stroke-width="3" stroke-dasharray="7 5" opacity=".8"/>
<rect x="530" y="92" width="205" height="38" rx="19" fill="#fff0dd" stroke="#e7a45b"/>
<text x="632" y="116" text-anchor="middle" class="equation">1 + 3 + 6 + 10 = 20</text>
<style>
