.subheading{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#52635d}
.row{font:600 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#819087}
.cell{fill:#e8f0ec;stroke:#4d766a;stroke-width:1.4}
