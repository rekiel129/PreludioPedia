<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
<title id="title">Triángulo de Pascal, ocho filas</title>
<desc id="desc">Las filas 0 a 7 del triángulo de Pascal, con cada número dentro de un círculo.</desc>
<rect width="780" height="520" rx="24" fill="#f6f6f2"/>
<text x="40" y="49" class="heading">Triángulo de Pascal</text>
<text x="40" y="78" class="subheading">Ocho filas, numeradas desde 0</text>
<text x="40" y="104" class="note">Cada fila interior se forma sumando los dos valores de arriba.</text>
