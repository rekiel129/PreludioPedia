.heading{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#163d35}
.subheading{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#52635d}
.note{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#74817b}
.row{font:600 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#819087}
.cell{fill:#e8f0ec;stroke:#4d766a;stroke-width:1.4}
.value{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f4038;text-anchor:middle}
</style>
